[project]
name = "wellmanifest-poa"
version = "0.1.0"
description = "Wellmanifest Process-Oriented Architecture (POA) v1 and v2 conformance validators"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.wellmanifest]
standard = "0.20.162"
revision = "8e6b51dc91a2ac7e1e771908e0fac5e12da0b9a0"
gate = "project/governance-check.sh"

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance -p no:cacheprovider"
pythonpath = [".", "standard"]
testpaths = ["tests", "standard"]
