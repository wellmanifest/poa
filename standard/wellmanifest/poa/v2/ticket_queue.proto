syntax = "proto3";

package wellmanifest.poa.v2;

// Revision-bound queue admission contract. This is a closed standard family,
// not a daemon and not an authority source. HOME is wellmanifest/poa;
// RuntimeOwner is Subactor. A URI identifies one logical process resource but
// does not grant permission to execute it.

option java_multiple_files = true;
option java_package = "org.wellmanifest.poa.v2";

enum QueueStepKind {
  QUEUE_STEP_KIND_UNSPECIFIED = 0;
  QUEUE_STEP_KIND_QUERY = 1;
  QUEUE_STEP_KIND_COMMAND = 2;
}

enum RollbackMode {
  ROLLBACK_MODE_UNSPECIFIED = 0;
  ROLLBACK_MODE_AUTOMATIC = 1;
  ROLLBACK_MODE_COMPENSATING = 2;
  ROLLBACK_MODE_NONE = 3;
}

enum AdmissionDecision {
  ADMISSION_DECISION_UNSPECIFIED = 0;
  ADMISSION_DECISION_ACCEPT = 1;
  ADMISSION_DECISION_REJECT = 2;
}

enum QueueAdmissionState {
  QUEUE_ADMISSION_STATE_UNSPECIFIED = 0;
  QUEUE_ADMISSION_STATE_PLANNED = 1;
  QUEUE_ADMISSION_STATE_REJECTED = 2;
  QUEUE_ADMISSION_STATE_ADMITTED = 3;
  QUEUE_ADMISSION_STATE_RUNNING = 4;
}

message QueueStep {
  string id = 1;
  string capability_ref = 2;
  string process_uri = 3;
  QueueStepKind kind = 4;
  repeated string depends_on = 5;
  RollbackMode rollback = 6;
  string rollback_process_uri = 7;
}

message QueuePlan {
  string schema = 1;
  string plan_id = 2;
  string ticket_id = 3;
  uint64 queue_revision = 4;
  string proposed_by = 5;
  string created_at = 6;
  repeated QueueStep steps = 7;
  string authority_ref = 8;
  string hash_profile = 9;
  string plan_hash = 10;
}

message QueueAdmission {
  string schema = 1;
  string admission_id = 2;
  string ticket_id = 3;
  uint64 queue_revision = 4;
  string plan_hash = 5;
  AdmissionDecision decision = 6;
  string decided_by = 7;
  bool independent = 8;
  string reason_code = 9;
  string authority_ref = 10;
}

message ProposeProcessQueue {
  string schema = 1;
  QueuePlan plan = 2;
}

message DecideProcessQueueAdmission {
  string schema = 1;
  QueueAdmission admission = 2;
}

message ReplanProcessQueue {
  string schema = 1;
  string ticket_id = 2;
  uint64 expected_queue_revision = 3;
  QueuePlan replacement = 4;
}

message StartAdmittedProcessQueue {
  string schema = 1;
  string ticket_id = 2;
  uint64 queue_revision = 3;
  string plan_hash = 4;
  string executor = 5;
}

message GetProcessQueueAdmissionView {
  string schema = 1;
  string ticket_id = 2;
}

message QueueAdmissionView {
  string schema = 1;
  string ticket_id = 2;
  uint64 queue_revision = 3;
  QueueAdmissionState state = 4;
  QueuePlan plan = 5;
  QueueAdmission admission = 6;
}

message QueueAdmissionEvent {
  string schema = 1;
  string event_id = 2;
  string event_type = 3;
  string ticket_id = 4;
  uint64 queue_revision = 5;
  string plan_hash = 6;
}

service TicketQueueAdmissionCommands {
  rpc ProposeProcessQueue(ProposeProcessQueue) returns (QueueAdmissionEvent);
  rpc DecideProcessQueueAdmission(DecideProcessQueueAdmission) returns (QueueAdmissionEvent);
  rpc ReplanProcessQueue(ReplanProcessQueue) returns (QueueAdmissionEvent);
  rpc StartAdmittedProcessQueue(StartAdmittedProcessQueue) returns (QueueAdmissionEvent);
}

service TicketQueueAdmissionQueries {
  rpc GetProcessQueueAdmissionView(GetProcessQueueAdmissionView) returns (QueueAdmissionView);
}
